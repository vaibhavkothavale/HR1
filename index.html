<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Hiring Page with Dynamic Admin Credentials</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background: #f6f6f8;
    margin: 0; padding: 0;
    display: flex; flex-direction: column; align-items: center;
  }
  .navbar {
    width: 100%;
    max-width: 700px;
    background-color: #2940d3;
    display: flex;
    justify-content: flex-start;
    align-items: center;
    padding: 12px 20px;
    box-sizing: border-box;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .navbar button {
    margin-right: 12px;
    background-color: transparent;
    border: none;
    color: white;
    font-size: 1rem;
    font-weight: bold;
    cursor: pointer;
    padding: 8px 16px;
    border-radius: 6px;
    transition: background-color 0.3s;
  }
  .navbar button:hover, .navbar button.active {
    background-color: #17217a;
  }

  section {
    width: 100%;
    max-width: 700px;
    background: white;
    border-radius: 10px;
    padding: 20px;
    margin-top: 1rem;
    box-shadow: 0 3px 12px rgba(44, 62, 80, 0.1);
  }
  .job-card {
    border: 1px solid #ccc;
    border-radius: 8px;
    padding: 15px;
    margin-bottom: 12px;
    position: relative;
  }
  .job-card h3 {
    margin: 0 0 8px 0;
  }
  .job-card p {
    margin: 0 0 8px 0;
  }
  .apply-btn {
    display: inline-block;
    background: #2940d3;
    color: white;
    padding: 8px 18px;
    border-radius: 6px;
    text-decoration: none;
    font-weight: bold;
  }
  .delete-btn {
    position: absolute;
    top: 12px;
    right: 12px;
    background: #e55353;
    border: none;
    color: white;
    border-radius: 20px;
    padding: 4px 10px;
    cursor: pointer;
  }
  form input, form textarea {
    width: 100%;
    margin-bottom: 10px;
    padding: 8px;
    font-size: 1rem;
    border-radius: 6px;
    border: 1px solid #ccc;
  }
  form button {
    width: 100%;
    font-size: 1.1rem;
    background-color: #2940d3;
    color: white;
    border: none;
    border-radius: 6px;
    cursor: pointer;
  }
  form button:hover {
    background-color: #17217a;
  }
  #login-section {
    background: #fff;
    padding: 20px;
    border-radius: 10px;
    box-shadow: 0 3px 12px rgba(44, 62, 80, 0.1);
    max-width: 400px;
    margin: auto;
    margin-top: 1rem;
  }
  #login-section h2 {
    text-align: center;
  }
  #login-error {
    color: red;
    text-align: center;
    margin-bottom: 10px;
  }
  #settings-section input {
    margin-bottom: 15px;
  }
  #logout-btn {
    background: #e55353;
    margin-top: 10px;
  }
</style>
</head>
<body>

<nav class="navbar">
  <button id="nav-user-panel" class="active">User Panel</button>
  <button id="nav-admin-panel">Admin Panel</button>
</nav>

<section id="user-section">
  <h2>Job Openings</h2>
  <div id="user-jobs"></div>
</section>

<section id="login-section" style="display:none;">
  <h2>Admin Login</h2>
  <div id="login-error"></div>
  <form id="login-form">
    <input type="text" id="username" placeholder="Username" required />
    <input type="password" id="password" placeholder="Password" required />
    <button type="submit">Login</button>
  </form>
</section>

<section id="admin-section" style="display:none; margin-top: 1rem;">
  <div id="admin-tabs">
    <button id="tab-manage" class="active">Manage Jobs</button>
    <button id="tab-settings">Settings</button>
  </div>

  <div id="manage-jobs-section">
    <h2>Add Job Opening</h2>
    <form id="job-form">
      <input type="text" id="jobTitle" placeholder="Job Title" required />
      <input type="text" id="jobMeta" placeholder="Location & Job Type" required />
      <textarea id="jobDesc" placeholder="Job Description" rows="3" required></textarea>
      <input type="email" id="jobEmail" placeholder="Application Email" required />
      <button type="submit">Add Job</button>
    </form>
    <hr />
    <h2>Manage Job Openings</h2>
    <div id="admin-jobs"></div>
  </div>

  <div id="settings-section" style="display:none;">
    <h2>Admin Settings</h2>
    <form id="settings-form">
      <input type="text" id="new-username" placeholder="New Username" required />
      <input type="password" id="new-password" placeholder="New Password" required />
      <button type="submit">Save Credentials</button>
    </form>
    <button id="logout-btn">Logout</button>
  </div>
</section>

<script>
  const navUserBtn = document.getElementById('nav-user-panel');
  const navAdminBtn = document.getElementById('nav-admin-panel');
  const userSection = document.getElementById('user-section');
  const loginSection = document.getElementById('login-section');
  const adminSection = document.getElementById('admin-section');

  const loginForm = document.getElementById('login-form');
  const loginError = document.getElementById('login-error');

  const userJobsContainer = document.getElementById('user-jobs');
  const adminJobsContainer = document.getElementById('admin-jobs');
  const jobForm = document.getElementById('job-form');

  const tabManage = document.getElementById('tab-manage');
  const tabSettings = document.getElementById('tab-settings');
  const manageJobsSection = document.getElementById('manage-jobs-section');
  const settingsSection = document.getElementById('settings-section');

  const settingsForm = document.getElementById('settings-form');
  const newUsernameInput = document.getElementById('new-username');
  const newPasswordInput = document.getElementById('new-password');
  const logoutBtn = document.getElementById('logout-btn');

  let isAdminLoggedIn = false;
  let jobs = [
    {
      title: 'Frontend Developer',
      meta: 'Remote · Full Time',
      desc: 'Work on UI/UX to make engaging apps.',
      email: 'apply@example.com'
    },
    {
      title: 'Graphic Designer',
      meta: 'On-site · Part-Time',
      desc: 'Create stunning marketing content.',
      email: 'apply@example.com'
    }
  ];

  // Initialize credentials in localStorage only once
  if (!localStorage.getItem('adminCredentials')) {
    localStorage.setItem('adminCredentials', JSON.stringify({ username: 'admin', password: 'password123' }));
    console.log('Default admin credentials saved to localStorage');
  } else {
    console.log('Admin credentials found in localStorage');
  }

  function getAdminCredentials() {
    const stored = localStorage.getItem('adminCredentials');
    if (stored) {
      try {
        return JSON.parse(stored);
      } catch (e) {
        console.error('Error parsing adminCredentials:', e);
        localStorage.setItem('adminCredentials', JSON.stringify({ username: 'admin', password: 'password123' }));
        return { username: 'admin', password: 'password123' };
      }
    }
    return { username: 'admin', password: 'password123' };
  }

  function saveAdminCredentials(username, password) {
    if (!username || !password) {
      alert('Username and password cannot be empty.');
      return false;
    }
    localStorage.setItem('adminCredentials', JSON.stringify({ username, password }));
    alert('Credentials updated successfully.');
    console.log('Admin credentials saved:', username);
    return true;
  }

  function renderJobs() {
    userJobsContainer.innerHTML = '';
    adminJobsContainer.innerHTML = '';

    jobs.forEach((job, index) => {
      const userCard = document.createElement('div');
      userCard.className = 'job-card';
      userCard.innerHTML = `
        <h3>${job.title}</h3>
        <p><em>${job.meta}</em></p>
        <p>${job.desc}</p>
        <a href="mailto:${job.email}?subject=Application for ${encodeURIComponent(job.title)}" class="apply-btn">Apply Now</a>
      `;
      userJobsContainer.appendChild(userCard);

      const adminCard = document.createElement('div');
      adminCard.className = 'job-card';
      adminCard.innerHTML = `
        <h3>${job.title}</h3>
        <p><em>${job.meta}</em></p>
        <p>${job.desc}</p>
        <a href="mailto:${job.email}?subject=Application for ${encodeURIComponent(job.title)}" class="apply-btn">Apply Now</a>
        <button class="delete-btn" data-index="${index}">Delete</button>
      `;
      adminJobsContainer.appendChild(adminCard);
    });

    document.querySelectorAll('.delete-btn').forEach(btn => {
      btn.onclick = e => {
        const i = e.target.getAttribute('data-index');
        if (confirm('Are you sure you want to delete this job?')) {
          jobs.splice(i, 1);
          renderJobs();
        }
      };
    });
  }

  navUserBtn.addEventListener('click', () => {
    navUserBtn.classList.add('active');
    navAdminBtn.classList.remove('active');
    userSection.style.display = 'block';
    loginSection.style.display = 'none';
    adminSection.style.display = 'none';
  });

  navAdminBtn.addEventListener('click', () => {
    navAdminBtn.classList.add('active');
    navUserBtn.classList.remove('active');
    userSection.style.display = 'none';

    if (!isAdminLoggedIn) {
      loginSection.style.display = 'block';
      adminSection.style.display = 'none';
    } else {
      loginSection.style.display = 'none';
      adminSection.style.display = 'block';
      showManageJobsTab();
    }
  });

  loginForm.onsubmit = e => {
    e.preventDefault();
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;
    const creds = getAdminCredentials();

    if (username === creds.username && password === creds.password) {
      isAdminLoggedIn = true;
      loginSection.style.display = 'none';
      adminSection.style.display = 'block';
      loginError.textContent = '';
      navAdminBtn.classList.add('active');
      navUserBtn.classList.remove('active');
      renderJobs();
      showManageJobsTab();
    } else {
      loginError.textContent = 'Invalid username or password.';
    }
  };

  jobForm.onsubmit = e => {
    e.preventDefault();
    const title = document.getElementById('jobTitle').value.trim();
    const meta = document.getElementById('jobMeta').value.trim();
    const desc = document.getElementById('jobDesc').value.trim();
    const email = document.getElementById('jobEmail').value.trim();

    if (title && meta && desc && email) {
      jobs.push({ title, meta, desc, email });
      jobForm.reset();
      alert('Job added!');
      renderJobs();
    }
  };

  tabManage.addEventListener('click', () => {
    showManageJobsTab();
  });
  tabSettings.addEventListener('click', () => {
    showSettingsTab();
  });

  function showManageJobsTab() {
    tabManage.classList.add('active');
    tabSettings.classList.remove('active');
    manageJobsSection.style.display = 'block';
    settingsSection.style.display = 'none';
  }
  function showSettingsTab() {
    tabSettings.classList.add('active');
    tabManage.classList.remove('active');
    manageJobsSection.style.display = 'none';
    settingsSection.style.display = 'block';

    const creds = getAdminCredentials();
    newUsernameInput.value = creds.username;
    newPasswordInput.value = creds.password;
  }

  settingsForm.onsubmit = e => {
    e.preventDefault();
    const newUser = newUsernameInput.value.trim();
    const newPass = newPasswordInput.value;

    if (newUser && newPass) {
      saveAdminCredentials(newUser, newPass);

      isAdminLoggedIn = false;
      adminSection.style.display = 'none';
      loginSection.style.display = 'block';
      navUserBtn.classList.remove('active');
      navAdminBtn.classList.add('active');
      loginError.textContent = '';
      loginForm.reset();
    }
  };

  logoutBtn.onclick = () => {
    isAdminLoggedIn = false;
    adminSection.style.display = 'none';
    loginSection.style.display = 'block';
    navUserBtn.classList.remove('active');
    navAdminBtn.classList.add('active');
    loginError.textContent = '';
    loginForm.reset();
  };

  // Initial load
  navUserBtn.click();
  renderJobs();


function renderJobs() {
  userJobsContainer.innerHTML = '';
  adminJobsContainer.innerHTML = '';

  jobs.forEach((job, index) => {
    // User job card
    const userCard = document.createElement('div');
    userCard.className = 'job-card';
    userCard.innerHTML = `
      <h3>${job.title}</h3>
      <p><em>${job.meta}</em></p>
      <p>${job.desc}</p>
      <a href="mailto:${job.email}?subject=Application for ${encodeURIComponent(job.title)}" class="apply-btn">Apply Now</a>
    `;
    userJobsContainer.appendChild(userCard);

    // Admin job card with Edit and Delete
    const adminCard = document.createElement('div');
    adminCard.className = 'job-card';
    adminCard.innerHTML = `
      <h3>${job.title}</h3>
      <p><em>${job.meta}</em></p>
      <p>${job.desc}</p>
      <a href="mailto:${job.email}?subject=Application for ${encodeURIComponent(job.title)}" class="apply-btn">Apply Now</a>
      <button class="edit-btn" data-index="${index}">Edit</button>
      <button class="delete-btn" data-index="${index}">Delete</button>
      <div class="edit-form-container" style="display:none;"></div>
    `;
    adminJobsContainer.appendChild(adminCard);
  });

  document.querySelectorAll('.delete-btn').forEach(btn => {
    btn.onclick = e => {
      const i = e.target.getAttribute('data-index');
      if (confirm('Are you sure you want to delete this job?')) {
        jobs.splice(i, 1);
        renderJobs();
      }
    };
  });

  document.querySelectorAll('.edit-btn').forEach(btn => {
    btn.onclick = e => {
      const i = parseInt(e.target.getAttribute('data-index'));
      startEditJob(i, btn.parentElement);
    };
  });
}

function startEditJob(index, cardElement) {
  const job = jobs[index];
  const editFormContainer = cardElement.querySelector('.edit-form-container');
  editFormContainer.innerHTML = `
    <form class="edit-job-form">
      <input type="text" name="title" value="${job.title}" required />
      <input type="text" name="meta" value="${job.meta}" required />
      <textarea name="desc" required>${job.desc}</textarea>
      <input type="email" name="email" value="${job.email}" required />
      <button type="submit">Save</button>
      <button type="button" class="cancel-edit">Cancel</button>
    </form>
  `;
  editFormContainer.style.display = "block";
  // Hide other card content for clarity (optional: comment lines below if you prefer to keep visible)
  Array.from(cardElement.children).forEach(child => {
    if (child !== editFormContainer) child.style.display = "none";
  });

  editFormContainer.querySelector('.edit-job-form').onsubmit = function(ev) {
    ev.preventDefault();
    jobs[index] = {
      title: this.title.value.trim(),
      meta: this.meta.value.trim(),
      desc: this.desc.value.trim(),
      email: this.email.value.trim()
    };
    renderJobs();
  };

  editFormContainer.querySelector('.cancel-edit').onclick = function() {
    renderJobs();
  };
}

const admin = require('firebase-admin');
admin.initializeApp();

const uid = 'USER_UID_TO_MAKE_ADMIN';  // Replace with admin user UID

admin.auth().setCustomUserClaims(uid, { admin: true })
  .then(() => {
    console.log('Custom admin claim set successfully');
  })
  .catch(err => {
    console.error('Error setting custom claim:', err);
  });

auth.onAuthStateChanged(async user => {
  if (user) {
    const idTokenResult = await user.getIdTokenResult();
    const isAdmin = idTokenResult.claims.admin === true;

    if (isAdmin) {
      adminSection.style.display = 'block';
      userSection.style.display = 'none';
      loginSection.style.display = 'none';
      showManageJobsTab();
    } else {
      adminSection.style.display = 'none';
      userSection.style.display = 'block';
      loginSection.style.display = 'none';
    }
  } else {
    adminSection.style.display = 'none';
    userSection.style.display = 'none';
    loginSection.style.display = 'block';
  }
});

</script>

</body>
</html>
